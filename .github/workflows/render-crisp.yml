name: Render Crisp Cardiac Cycle

on:
  push:
    branches:
      - remotion-cardiac-cycle-20261001
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion
        run: npm install
      - name: Render crisp 60-second video
        run: npx remotion render src/index-crisp.tsx CardiacCycleCrisp out/cardiac-cycle-crisp.mp4 --codec=h264 --crf=16 --concurrency=2
      - name: Check output
        run: |
          test -s out/cardiac-cycle-crisp.mp4
          ls -lh out/cardiac-cycle-crisp.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cardiac-cycle-crisp
          path: out/cardiac-cycle-crisp.mp4
          retention-days: 7
