name: Render Remotion Cardiac Cycle
on:
  push:
    branches: [remotion-cardiac-cycle-20261001]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild AI artwork and phase crops
        run: |
          mkdir -p public out
          cat assets/storyboard.b64.part* | tr -d '\n' | base64 -d > public/storyboard.jpg
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('public/storyboard.jpg').convert('RGB')
          w,h=im.size
          pw,ph=w//4,h//2
          out=Path('public')
          for idx in range(8):
              r,c=divmod(idx,4)
              crop=im.crop((c*pw,r*ph,(c+1)*pw,(r+1)*ph))
              crop=crop.resize((756,1012),Image.Resampling.LANCZOS)
              crop.save(out/f'phase{idx}.jpg',quality=91)
          PY
      - name: Generate heartbeat audio
        run: |
          python - <<'PY'
          import math,wave,array
          sr=22050; dur=60
          data=array.array('h',[0])*(sr*dur)
          for beat_i in range(1,75):
              beat=beat_i*0.8
              for off,freq,amp,decay in [(0.0,58,12000,18),(0.26,82,8500,24)]:
                  start=int((beat+off)*sr)
                  length=int(.18*sr)
                  for j in range(length):
                      k=start+j
                      if k>=len(data): break
                      t=j/sr
                      v=int(amp*math.exp(-decay*t)*(math.sin(2*math.pi*freq*t)+.4*math.sin(2*math.pi*freq*2.1*t)))
                      data[k]=max(-32768,min(32767,data[k]+v))
          with wave.open('public/heartbeat.wav','wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr); f.writeframes(data.tobytes())
          PY
      - run: npm install --no-audit --no-fund
      - name: Render 60-second Remotion MP4
        run: npx remotion render src/index.tsx CardiacCycle out/cardiac-cycle-remotion-ai.mp4 --codec=h264 --crf=18 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: cardiac-cycle-remotion-ai
          path: out/cardiac-cycle-remotion-ai.mp4
          if-no-files-found: error
